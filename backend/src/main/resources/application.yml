server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: spovisor-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spovisor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-secret-to-a-long-random-value-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  naver:
    local:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}

logging:
  level:
    org.flywaydb: INFO
